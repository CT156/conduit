name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 提前生成 iOS 配置和 symlinks，确保后续 find 能搜到插件
      - name: Generate iOS config & symlinks
        run: flutter build ios --config-only --no-codesign || true

      # 关键修复：必须使用 -L 跟随符号链接，因为 ios/.symlinks 下全是链接
      - name: Fix plugin podspec Ruby syntax
        run: |
          echo "Patching podspec files in ios/.symlinks ..."
          find -L ios -name "*.podspec" -type f 2>/dev/null | while read -r f; do
            if grep -q ':execution_position=>' "$f" 2>/dev/null; then
              echo "  Fixed: $f"
              sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$f"
              rm -f "$f.bak"
            fi
          done

          echo "Patching podspec files in pub cache ..."
          find -L ~/.pub-cache -name "*.podspec" -type f 2>/dev/null | while read -r f; do
            if grep -q ':execution_position=>' "$f" 2>/dev/null; then
              echo "  Fixed: $f"
              sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$f"
              rm -f "$f.bak"
            fi
          done

      # 修复 connectivity_plus 在旧版 Xcode / 新 API 上的兼容性问题
      - name: Fix connectivity_plus Swift compatibility
        run: |
          find -L ~/.pub-cache -path "*/connectivity_plus*/PathMonitorConnectivityProvider.swift" -type f 2>/dev/null | while read -r f; do
            if grep -q "isUltraConstrained" "$f" 2>/dev/null; then
              echo "Removing isUltraConstrained from: $f"
              sed -i.bak '/isUltraConstrained/d' "$f"
              rm -f "$f.bak"
            fi
          done

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
