name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 关键修复：super_native_extensions 的 podspec 有 Ruby 语法问题
      # 问题1: :execution_position=> 缺少空格
      # 问题2: SCRIPT heredoc 结束标记后面缺少逗号（Ruby 3.3 严格模式报错）
      - name: Fix super_native_extensions podspec
        run: |
          PODSPEC=$(find ~/.pub-cache/git -path "*/super_native_extensions*/ios/super_native_extensions.podspec" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$PODSPEC" ]; then
            echo "Warning: super_native_extensions podspec not found in pub cache"
            exit 0
          fi
          
          echo "Found podspec: $PODSPEC"
          
          # 修复1: 确保 => 前面有空格
          sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC"
          
          # 修复2: 在 SCRIPT heredoc 结束标记和下一行的 :execution_position 之间插入逗号
          # Ruby 3.3 要求 hash 的键值对之间必须用逗号分隔
          perl -i.bak -0777 -pe 's/SCRIPT(\s*\n\s*):execution_position\s*=>/SCRIPT,$1:execution_position =>/g' "$PODSPEC"
          
          rm -f "$PODSPEC.bak"
          
          echo "Podspec patched. Verifying around execution_position:"
          grep -n -A1 -B1 "execution_position" "$PODSPEC" || true

      - name: Generate iOS config & symlinks
        run: flutter build ios --config-only --no-codesign

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
