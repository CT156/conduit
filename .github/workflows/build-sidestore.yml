name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 关键：在 flutter 创建 symlinks / 运行 pod install 之前，先修好 pub cache 里的原始文件
      - name: Fix super_native_extensions podspec syntax
        run: |
          echo "Patching podspec files in pub cache..."
          find -L ~/.pub-cache -name "*.podspec" -type f 2>/dev/null | while read -r f; do
            if grep -q ':execution_position=>' "$f" 2>/dev/null; then
              echo "  Fixed: $f"
              sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$f"
              rm -f "$f.bak"
            fi
          done

      # 提前生成 iOS 配置和 symlinks；此时 podspec 已修复，pod install 应该直接成功
      - name: Generate iOS config & symlinks
        run: flutter build ios --config-only --no-codesign

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
