name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 关键：Ruby 3.3 严格模式下，hash 键值对的 => 前面必须有空格
      # 只修复空格，不要在 SCRIPT 后面加任何字符！
      - name: Fix super_native_extensions podspec
        run: |
          PODSPEC=$(find ~/.pub-cache/git -path "*/super_native_extensions*/ios/super_native_extensions.podspec" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$PODSPEC" ]; then
            echo "Warning: podspec not found"
            exit 0
          fi
          
          echo "Found: $PODSPEC"
          
          # 仅修复 => 前无空格的问题
          sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC"
          rm -f "$PODSPEC.bak"
          
          echo "Patched. Verifying:"
          grep -n "execution_position" "$PODSPEC" || true

      # Xcode 16.3 原生支持 isUltraConstrained，不需要修复 connectivity_plus
      - name: Generate iOS config & symlinks
        run: flutter build ios --config-only --no-codesign

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
