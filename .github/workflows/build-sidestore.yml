name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 先生成 symlinks，然后直接修复 symlinks 下的 podspec
      # 因为 pod install 实际读的是 .symlinks 下的文件，不是 pub cache
      - name: Generate iOS symlinks
        run: flutter build ios --config-only --no-codesign || true

      - name: Fix super_native_extensions podspec in symlinks
        run: |
          PODSPEC="ios/.symlinks/plugins/super_native_extensions/ios/super_native_extensions.podspec"
          
          if [ ! -f "$PODSPEC" ]; then
            echo "Error: $PODSPEC not found"
            # 尝试搜索
            find ios -name "super_native_extensions.podspec" -type f 2>/dev/null
            exit 1
          fi
          
          echo "Found: $PODSPEC"
          echo "Before fix:"
          grep -n "execution_position" "$PODSPEC" || true
          
          # 修复 => 前无空格
          sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC"
          rm -f "$PODSPEC.bak"
          
          echo "After fix:"
          grep -n "execution_position" "$PODSPEC" || true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
