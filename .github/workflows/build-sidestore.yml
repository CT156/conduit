name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment info
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # 某些插件的 podspec 用了旧 Ruby hash 语法，在较新 Ruby 版本下会解析失败
      - name: Fix plugin podspec syntax issues
        run: |
          find ios -name "*.podspec" -type f 2>/dev/null | while read -r f; do
            if grep -q ':execution_position=>' "$f" 2>/dev/null; then
              echo "Fixing Ruby syntax in: $f"
              sed -i '' 's/:execution_position=>/:execution_position =>/g' "$f"
            fi
          done

      # 修复 connectivity_plus 在旧版 Xcode / 新 API 上的兼容性问题
      - name: Fix connectivity_plus Swift compatibility
        run: |
          find ~/.pub-cache -path "*/connectivity_plus*/PathMonitorConnectivityProvider.swift" -type f 2>/dev/null | while read -r f; do
            if grep -q "isUltraConstrained" "$f" 2>/dev/null; then
              echo "Removing isUltraConstrained from: $f"
              sed -i '' '/isUltraConstrained/d' "$f"
            fi
          done

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Locate build output
        id: locate
        run: |
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "path=build/ios/Release-iphoneos/Runner.app" >> $GITHUB_OUTPUT
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "path=build/ios/iphoneos/Runner.app" >> $GITHUB_OUTPUT
          else
            echo "Error: Runner.app not found. Searching..."
            find build/ios -name "Runner.app" -type d
            exit 1
          fi

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R ${{ steps.locate.outputs.path }} Payload/
          zip -r Conduit_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA packaged successfully:"
          ls -lh Conduit_Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-Unsigned-IPA
          path: Conduit_Unsigned.ipa
          if-no-files-found: error
