name: Build Unsigned IPA

on:
  workflow_dispatch: # 允許手動點擊按鈕執行

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install CocoaPods (Gem)
        run: |
          sudo gem install cocoapods

      - name: Install Flutter & Dart Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Patch super_native_extensions.podspec syntax (if exists)
        run: |
          PODSPEC_PATH="ios/.symlinks/plugins/super_native_extensions/ios/super_native_extensions.podspec"
          if [ -f "$PODSPEC_PATH" ]; then
            echo "Patching $PODSPEC_PATH ..."
            # 修正所有 :key=>value 变成 :key => value
            sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC_PATH"
            echo "Patch done. Diff:"
            diff "$PODSPEC_PATH.bak" "$PODSPEC_PATH" | cat
          else
            echo "No super_native_extensions.podspec found, skipping patch."
          fi

      - name: Install CocoaPods Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Conduit_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-IPA
          path: Conduit_Unsigned.ipa
