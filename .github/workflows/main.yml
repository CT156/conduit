name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods via Gem
        run: |
          # 解除 Homebrew CocoaPods
          brew uninstall --ignore-dependencies cocoapods 2>/dev/null || true
          brew cleanup 2>/dev/null || true

          # 安裝獨立的 CocoaPods
          GEM_HOME_DIR="$HOME/.gem-custom"
          mkdir -p "$GEM_HOME_DIR"
          GEM_HOME=$GEM_HOME_DIR gem install cocoapods -N --no-document

          # 設定環境變數
          echo "GEM_HOME=$GEM_HOME_DIR" >> $GITHUB_ENV
          echo "$GEM_HOME_DIR/bin" >> $GITHUB_PATH

      # 關鍵修正：直接修正 .symlinks 中的 podspec
      - name: Patch super_native_extensions podspec in .symlinks
        run: |
          echo "🔍 Looking for podspec in .symlinks..."
          
          # 檢查 .symlinks 目錄是否存在
          if [ -d "ios/.symlinks/plugins/super_native_extensions" ]; then
            PODSPEC_PATH="ios/.symlinks/plugins/super_native_extensions/ios/super_native_extensions.podspec"
            
            if [ -f "$PODSPEC_PATH" ]; then
              echo "✅ Found podspec at: $PODSPEC_PATH"
              echo "📄 Before patch:"
              grep -n "execution_position" "$PODSPEC_PATH" || echo "   (not found)"
              
              # 執行修正
              sed -i '' 's/:execution_position=>/:execution_position =>/g' "$PODSPEC_PATH"
              
              echo "📄 After patch:"
              grep -n "execution_position" "$PODSPEC_PATH" || echo "   (not found)"
              echo "✅ Patch applied to .symlinks version!"
            else
              echo "❌ Podspec file not found at expected path"
              echo "📂 Contents of ios/.symlinks/plugins/super_native_extensions/:"
              ls -la ios/.symlinks/plugins/super_native_extensions/ios/ 2>/dev/null || echo "   (directory empty or missing)"
            fi
          else
            echo "❌ .symlinks directory not found for super_native_extensions"
            echo "📂 Checking ios/.symlinks/plugins/ directory:"
            ls ios/.symlinks/plugins/ 2>/dev/null || echo "   (directory not found)"
          fi
          
          # 同時也修正 pub cache 以備不時之需
          echo "🔄 Also applying patch to pub cache..."
          find ~/.pub-cache -name "super_native_extensions.podspec" -exec sh -c '
            echo "   → Patching: $1"
            sed -i "" "s/:execution_position=>/:execution_position =>/g" "$1"
          ' _ {} \; 2>/dev/null || echo "   (no pub cache entries found)"

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Conduit_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-IPA
          path: Conduit_Unsigned.ipa
