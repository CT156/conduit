name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Flutter deps
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # 强制提前生成 symlinks 和 Podspec 文件，确保 patch 步骤不会失效
      - name: Pre-generate iOS symlinks and podspecs
        run: |
          flutter build ios --no-codesign --simulator || true

      # Patch Ruby 语法
      - name: Patch super_native_extensions.podspec syntax (自动修复 Ruby podspec 语法)
        run: |
          SPECDIR="ios/.symlinks/plugins/super_native_extensions/ios"
          PODSPEC="$SPECDIR/super_native_extensions.podspec"
          if [ -f "$PODSPEC" ]; then
            echo "🚑 Patching podspec Ruby syntax: $PODSPEC"
            sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC"
            diff "$PODSPEC.bak" "$PODSPEC" || echo 'Patch already applied or nothing changed.'
          else
            echo "⚪️ $PODSPEC not found, patch skipped."
          fi

      - name: Patch connectivity_plus for older Xcode
        run: |
          SWIFT_PATH="$HOME/.pub-cache/hosted/pub.dev/connectivity_plus-7.1.1/ios/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
          if grep -q "isUltraConstrained" "$SWIFT_PATH" 2>/dev/null; then
            echo "🩹 Removing isUltraConstrained usage for compatibility..."
            sed -i.bak '/isUltraConstrained/d' "$SWIFT_PATH"
            grep ultraConstrained "$SWIFT_PATH" || echo "已移除 isUltraConstrained"
          else
            echo "connectivity_plus Swift 源码无 isUltraConstrained 字样，跳过补丁。"
          fi

      - name: Install CocoaPods Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Conduit_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-IPA
          path: Conduit_Unsigned.ipa
