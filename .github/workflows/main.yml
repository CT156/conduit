name: Build Unsigned IPA

on:
  workflow_dispatch: # 允許手動點擊按鈕執行

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'
          
      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Patch Ruby 3.3 syntax in Pub Cache
        run: |
          # 直接去全域快取目錄，找到那個檔案並修正語法錯誤 (強制補上空格)
          find ~/.pub-cache -name "super_native_extensions.podspec" -exec sed -i '' 's/:execution_position=>/:execution_position =>/g' {} +

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Conduit_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-IPA
          path: Conduit_Unsigned.ipa
