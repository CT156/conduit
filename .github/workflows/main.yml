name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # ★★ 强制等待建立 symlinks 目录，确保 podspec 存在
      - name: Pre-generate iOS Plugins (symlinks)
        run: |
          flutter build ios --no-codesign --simulator || true

      - name: Patch super_native_extensions.podspec syntax
        run: |
          PODSPEC="ios/.symlinks/plugins/super_native_extensions/ios/super_native_extensions.podspec"
          if [ -f "$PODSPEC" ]; then
            echo "✅ Found $PODSPEC, begin patch..."
            sed -i.bak 's/:execution_position=>/:execution_position =>/g' "$PODSPEC"
            echo "📝 Patch diff ↓↓↓"
            diff "$PODSPEC.bak" "$PODSPEC" || echo "No diff; already patched"
          else
            echo "⚪️ $PODSPEC 不存在，跳过修复。"
          fi

      - name: Install CocoaPods Pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Conduit_Unsigned.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-IPA
          path: Conduit_Unsigned.ipa
