name: Build iOS IPA for Sidestore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装最新稳定 Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: 检查 Flutter 和 Dart 版本
      run: |
        flutter --version
        dart --version

    - name: 禁用分析和获取依赖
      run: |
        flutter config --no-analytics
        flutter pub get --offline || flutter pub get

    - name: 构建 iOS IPA
      run: |
        flutter build ipa \
          --release \
          --export-method ad-hoc \
          --no-codesign

    - name: 上传 IPA 文件
      uses: actions/upload-artifact@v4
      with:
        name: conduit-ipa
        path: build/ios/ipa/*.ipa
