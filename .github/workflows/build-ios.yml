name: Build iOS IPA for Sidestore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Flutter（版本 3.27.0）
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: 检查 Flutter 和 Dart 版本
      run: |
        flutter --version
        dart --version

    - name: 禁用 Flutter Analytics
      run: flutter config --no-analytics

    - name: 清理之前的构建
      run: |
        flutter clean
        rm -rf pubspec.lock
        rm -rf ios/Pods
        rm -rf ios/Podfile.lock

    - name: 获取依赖
      run: flutter pub get

    - name: 构建 iOS app
      run: flutter build ios --release

    - name: 构建 IPA
      run: |
        cd ios
        xcodebuild -workspace Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -archivePath ../build/Runner.xcarchive \
          clean archive
        
        xcodebuild -exportArchive \
          -archivePath ../build/Runner.xcarchive \
          -exportPath ../build/ipa \
          -exportOptionsPlist ../ExportOptions.plist

    - name: 上传 IPA 文件
      uses: actions/upload-artifact@v4
      with:
        name: conduit-ipa
        path: build/ipa/*.ipa
