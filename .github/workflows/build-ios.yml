name: Build iOS IPA for Sidestore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Flutter（版本 3.27.0+ 包含 Dart 3.8+）
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: 检查 Flutter 和 Dart 版本
      run: |
        flutter --version
        dart --version

    - name: 获取依赖
      run: flutter pub get

    - name: 构建 iOS IPA
      run: |
        flutter build ipa \
          --release \
          --export-method ad-hoc \
          --no-codesign

    - name: 上传 IPA 文件
      uses: actions/upload-artifact@v4
      with:
        name: conduit-ipa
        path: build/ios/ipa/*.ipa
